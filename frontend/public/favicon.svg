<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PromptGram favicon">
  <defs>
    <linearGradient id="fvBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0070F3"/>
      <stop offset="52%" stop-color="#5145E6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
  </defs>

  <!-- background squircle -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#fvBg)"/>

  <!-- simple prompt card with 2 text lines (crisp at 16px) -->
  <rect x="396" y="344" width="232" height="336" rx="48" fill="#ffffff" fill-opacity="0.14" stroke="#ffffff" stroke-opacity="0.6" stroke-width="6"/>
  <g fill="#ffffff">
    <rect x="446" y="470" width="150" height="30" rx="15"/>
    <rect x="446" y="524" width="104" height="30" rx="15"/>
  </g>

  <!-- bold brackets [ ] -->
  <g fill="none" stroke="#ffffff" stroke-width="60" stroke-linecap="round" stroke-linejoin="round">
    <path d="M372 292 L288 292 L288 732 L372 732"/>
    <path d="M652 292 L736 292 L736 732 L652 732"/>
  </g>
</svg>
