<svg viewBox="0 0 1024 1024" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="PromptGram app icon">
  <defs>
    <linearGradient id="pgBg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0070F3"/>
      <stop offset="52%" stop-color="#5145E6"/>
      <stop offset="100%" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="pgTopLight" cx="30%" cy="22%" r="70%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.20"/>
      <stop offset="55%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="pgVignette" x1="0" y1="0" x2="0" y2="1">
      <stop offset="60%" stop-color="#000000" stop-opacity="0"/>
      <stop offset="100%" stop-color="#1e1b4b" stop-opacity="0.22"/>
    </linearGradient>
    <filter id="pgShadow" x="-40%" y="-40%" width="180%" height="180%">
      <feDropShadow dx="0" dy="8" stdDeviation="16" flood-color="#241a5e" flood-opacity="0.38"/>
    </filter>
  </defs>

  <!-- background squircle: blue -> purple -->
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#pgBg)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#pgTopLight)"/>
  <rect x="0" y="0" width="1024" height="1024" rx="230" fill="url(#pgVignette)"/>
  <rect x="4" y="4" width="1016" height="1016" rx="228" fill="none" stroke="#ffffff" stroke-opacity="0.14" stroke-width="2"/>

  <!-- glass prompt card with prompt text lines + cursor -->
  <g filter="url(#pgShadow)">
    <rect x="402" y="356" width="220" height="312" rx="46" fill="#ffffff" fill-opacity="0.16" stroke="#ffffff" stroke-opacity="0.42" stroke-width="3.5"/>
    <g fill="#ffffff">
      <rect x="442" y="452" width="140" height="22" rx="11" fill-opacity="0.95"/>
      <rect x="442" y="500" width="96"  height="22" rx="11" fill-opacity="0.85"/>
      <rect x="442" y="548" width="124" height="22" rx="11" fill-opacity="0.85"/>
      <!-- blinking-cursor accent at end of the short line -->
      <rect x="548" y="494" width="16" height="34" rx="6" fill-opacity="1"/>
    </g>
  </g>

  <!-- signature square brackets [ ] in white -->
  <g fill="none" stroke="#ffffff" stroke-width="48" stroke-linecap="round" stroke-linejoin="round" filter="url(#pgShadow)">
    <path d="M384 300 L300 300 L300 724 L384 724"/>
    <path d="M640 300 L724 300 L724 724 L640 724"/>
  </g>
</svg>
